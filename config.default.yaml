# ============================================================
# Assistant runtime config template (Arch Linux & macOS)
#
# ${ENV} placeholders are resolved from environment variables (empty if unset).
# Values left empty fall back to a sensible per-OS default, so this template
# works unmodified on both targets.
# ============================================================

# ── Server ─────────────────────────────────────────────
app:
  name: assistant
  port: 4321
  # empty = auto-detect the interface that owns the default route
  # (Linux: wlan0/eth0..., macOS: en0/en1...)
  interface: ""
  root_username: admin
  root_password: AAaa00__

# ── Logging ────────────────────────────────────────────
log:
  level: debug
  filename: ~/.config/assistant/logs/assistant.log
  max_size_mb: 8
  max_backups: 7
  max_age_days: 7
  compress: true
  format: text
  console: true

# ── System Settings ────────────────────────────────────
settings:
  vpn: socks5://127.0.0.1:7891
  # empty defaults: Linux "eDP-1", macOS "Built-in"
  default_monitor: ""
  # empty defaults: Linux "st", macOS "Terminal"
  # (macOS also accepts "iTerm"; other terminals must accept `-e <cmd>`)
  default_terminal: ""
  dir_snip: ~/git/obsidian/.snippets
  dir_wallpaper: ~/Pictures/wallpapers
  dir_working_logbook: ~/git/working/logbook
  # where AI answers are written (replaces the old hardcoded /home/... path)
  dir_ai_output: ~/git/test
  # Linux only (sysfs); leave empty to disable the keyboard-light endpoint
  filepath_keyboard_brightness: ""
  filepath_ssh_secret: ~/.ssh/my.ssh.json

  # ffmpeg capture devices; empty = per-OS default
  #   Linux: screen=$DISPLAY audio=default video=/dev/video0
  #   macOS: screen=1:none    audio=0       video=0:0
  capture_screen_device: ""
  capture_audio_device: ""
  capture_video_device: ""

  # Override any built-in platform command by intent. Keys:
  #   volume_up/down/toggle/set, audio_reset, mic_up/down/toggle/set,
  #   brightness_up/down/set, keyboard_light_toggle,
  #   screen_off, suspend, reboot, shutdown, lock, key_repeat_set
  # Templates may use {0}, {1} for positional args. Examples:
  #   commands:
  #     brightness_up: "brightness 0.05"        # brew install brightness
  #     keyboard_light_toggle: "kbdlight toggle"
  commands: {}

  feishu_app_id: ${FEISHU_APP_ID}
  feishu_app_secret: ${FEISHU_APP_SECRET}
  feishu_chat_id: ${FEISHU_CHAT_ID}

# ── LLM (OpenAI-compatible, single provider) ───────────
llm:
  base_url: https://api.deepseek.com
  api_key: ${DEEPSEEK_API_KEY}
  timeout: 300
  temperature: 0.3
  text_models:
    - deepseek-v4-flash
  vision_models:
    - deepseek-v4-flash-vision-exp

# ── Background Daemons ─────────────────────────────────
# empty procs = per-OS defaults: Linux (dwmblocks/picom/dunst), macOS (none).
background:
  enabled: true
  procs: []

# ── News Feed ──────────────────────────────────────────
news:
  enabled: false
  interval: 30m
  notify_interval: 8s
  notify_ttl: 4s
