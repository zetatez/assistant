# ============================================================
# Assistant runtime config (same structure as config.default.yaml)
# ${ENV} placeholders are resolved from environment variables (empty if unset).
# ============================================================

# ── Server ─────────────────────────────────────────────
app:
  name: assistant
  port: 4321
  interface: wlan0
  root_username: admin
  root_password: AAaa00__

# ── Logging ────────────────────────────────────────────
log:
  level: debug
  filename: ~/.config/assistant/logs/assistant.log
  max_size_mb: 8
  max_backups: 7
  max_age_days: 7
  compress: true
  format: text
  console: true

# ── System Settings ────────────────────────────────────
settings:
  vpn: socks5://127.0.0.1:7891
  default_monitor: eDP-1
  default_terminal: st
  dir_snip: ~/git/obsidian/.snippets
  dir_wallpaper: ~/Pictures/wallpapers
  dir_working_logbook: ~/git/working/logbook
  filepath_keyboard_brightness: /sys/class/leds/tpacpi::kbd_backlight/brightness
  filepath_ssh_secret: ~/.ssh/my.ssh.json
  feishu_app_id: ${FEISHU_APP_ID}
  feishu_app_secret: ${FEISHU_APP_SECRET}
  feishu_chat_id: ${FEISHU_CHAT_ID}

# ── LLM (OpenAI-compatible, single provider) ───────────
llm:
  base_url: http://127.0.0.1:3210/v1
  api_key: sk-d5d0dfffa7db3152a164a650c547c189e60421d9bb746ddf
  timeout: 300
  temperature: 0.3
  text_models:
    - deepseek/deepseek-v4.1-flash
  vision_models:
    - deepseek/deepseek-v4.1-flash

# ── Background Daemons ─────────────────────────────────
background:
  enabled: true
  procs:
    - name: dwmblocks
      command: dwmblocks
      precursor: dwm
    - name: fcitx5
      command: fcitx5 -d
      precursor: dwm
    - name: picom
      command: picom --config ~/.config/picom/picom.conf
      precursor: dwm
    - name: xset
      command: xset r rate 158 128
      precursor: dwm
      oneshot: true
    - name: dunst
      command: dunst
      precursor: dwm
    # - name: hhkb
    #   command: hhkb
    #   precursor: dwm

# ── News Feed ──────────────────────────────────────────
news:
  enabled: false
  interval: 30m
  notify_interval: 8s
  notify_ttl: 4s
