app:
  name: assistant
  host: 0.0.0.0
  port: 4321
  root_username: admin
  root_password: AAaa00__

log:
  level: debug
  filename: ~/.config/assistant/logs/assistant.log
  max_size_mb: 8
  max_backups: 7
  max_age_days: 7
  compress: true
  format: text
  console: true

settings:
  vpn: "socks5://127.0.0.1:7891"
  default_monitor: "eDP-1"
  default_terminal: "st"
  dir_snip: "~/git/obsidian/.snippets"
  dir_wallpaper: "~/Pictures/wallpapers"
  dir_working_logbook: "~/git/working/logbook"
  path_keyboard_brightness: "/sys/class/leds/tpacpi::kbd_backlight/brightness"
  path_ssh_secret: "~/.ssh/my.ssh.json"
  feishu:
    app_id: "${FEISHU_APP_ID}"
    app_secret: "${FEISHU_APP_SECRET}"
    chat_id: "${FEISHU_CHAT_ID}"

background:
  enabled: true
  procs:
    - name: dwmblocks
      command: dwmblocks
      precursor: dwm
    - name: fcitx5
      command: fcitx5 -d
      precursor: dwm
    - name: picom
      command: picom --config ~/.config/picom/picom.conf
      precursor: dwm
    - name: hhkb
      command: hhkb
      precursor: dwm
    - name: xset
      command: xset r rate 158 128
      precursor: dwm
    - name: clipmenud
      command: clipmenud
      precursor: dwm
    - name: dunst
      command: dunst
      precursor: dwm

llm_proxy:
  proxied_model: "assistant"
  proxied_api_key: "sk-your-token-here"
  probe_interval: 30
  timeout: 300
  temperature: 0.3
  balance_strategy: priority # priority | random | round_robin
  offline_failure_threshold: 3 # 连续失败次数达到后标记 offline
  rate_limit_cooldown: 60 # 429 限流的冷却秒数
  vision_models:
    - minimax-m3
  providers:
