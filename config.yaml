# ============================================================
# Assistant runtime config (same structure as config.default.yaml)
# ${ENV} placeholders are resolved from environment variables (empty if unset).
# ============================================================

# ── Server ─────────────────────────────────────────────
app:
  name: assistant        # service name
  host: 0.0.0.0          # listen address
  port: 4321             # listen port
  interface: ""          # default network interface, auto-detected if empty
  root_username: admin   # auth username
  root_password: AAaa00__  # auth password, change after deployment!

# ── Logging ────────────────────────────────────────────
log:
  level: debug           # debug | info | warn | error
  filename: ~/.config/assistant/logs/assistant.log
  max_size_mb: 8         # max size per log file (MB)
  max_backups: 7         # number of backups to keep
  max_age_days: 7        # number of days to keep backups
  compress: true         # compress archived logs
  format: text           # text | json
  console: true          # also write to console

# ── System Settings ────────────────────────────────────
settings:
  # Network
  vpn: "socks5://127.0.0.1:7891"   # upstream proxy (used by news and other outbound features)

  # Desktop
  default_monitor: "eDP-1"
  default_terminal: "st"

  # Paths
  dir_snip: "~/git/obsidian/.snippets"
  dir_wallpaper: "~/Pictures/wallpapers"
  dir_working_logbook: "~/git/working/logbook"
  filepath_keyboard_brightness: "/sys/class/leds/tpacpi::kbd_backlight/brightness"
  filepath_ssh_secret: "~/.ssh/my.ssh.json"

  # Feishu (used by /api/svr/send-to-feishu)
  feishu_app_id: "${FEISHU_APP_ID}"
  feishu_app_secret: "${FEISHU_APP_SECRET}"
  feishu_chat_id: "${FEISHU_CHAT_ID}"

# ── LLM (OpenAI-compatible, single provider) ───────────
llm:
  base_url: https://api.deepseek.com   # upstream Base URL
  api_key: "${DEEPSEEK_API_KEY}"       # upstream API key
  timeout: 300                         # upstream request timeout (seconds)
  temperature: 0.3                     # default sampling temperature
  # Model list order = priority: earlier models are preferred, failover moves to the next
  text_models:
    - deepseek-v4-flash
  vision_models:
    - deepseek-v4-flash-vision-exp

# ── Background Daemons ─────────────────────────────────
background:
  enabled: true
  # name: process name; command: launch command; precursor: prerequisite process name
  procs:
    - name: dwmblocks
      command: dwmblocks
      precursor: dwm
    - name: fcitx5
      command: fcitx5 -d
      precursor: dwm
    - name: picom
      command: picom --config ~/.config/picom/picom.conf
      precursor: dwm
    - name: hhkb
      command: hhkb
      precursor: dwm
    - name: xset
      command: xset r rate 158 128
      precursor: dwm
    - name: clipmenud
      command: clipmenud
      precursor: dwm
    - name: dunst
      command: dunst
      precursor: dwm

# ── News Feed ──────────────────────────────────────────
news:
  enabled: false
  interval: 30m          # fetch interval
  notify_interval: 8s    # notification throttle
  notify_ttl: 4s         # dwm status bar display duration