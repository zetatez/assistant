      base_url: https://api.deepseek.com
      api_key: "${DEEPSEEK_API_KEY}"
      models:
        - deepseek-v4-flash
        - deepseek-v4-pro
      priority: 4
      need_vpn: false

filebrowser:
  root: "/home/shiyi"
  allow:
    - "Documents"
    - "Downloads"
    - "Music"
    - "Pictures"
    - "Videos"
    - "git"
    - "x"
    - ".config"
  deny:
    - ".ssh"
    - ".gnupg"
  public:
    - "x"

tars:
  enabled: true
  data_dir: "~/.config/assistant/data"
  temperature: 0.3
  memory:
    max_history_mb: 64
    max_short_term: 64
    memory_summarize_every: 16
  wiki_search:
    enabled: true
    dir: "~/.config/assistant/wiki"
  web_search:
    enabled: true

news:
  enabled: false
  interval: 30m
  notify_interval: 8s
  notify_ttl: 4s
